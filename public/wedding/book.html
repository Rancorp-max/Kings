<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keepsake book — PartyDeck Weddings</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/icons/favicon-48.png" sizes="48x48" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" /><link rel="stylesheet" href="/wedding.css" />
  <style id="pageSize">@page { size: 8.5in 11in; margin: 0; }</style>
  <style>
    .book-controls { position: sticky; top: 0; z-index: 5; }
    .pages { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 16px 0 60px; }
    .page { background: #fbf4ea; color: #4a1840; box-shadow: 0 10px 30px rgba(0,0,0,.4); position: relative; overflow: hidden; box-sizing: border-box; padding: 0.55in; font-family: 'Noto Serif', var(--script-font, serif); }
    .page .frame { position: absolute; inset: 0.25in; border: 1.5px solid #b8862b; border-radius: 14px; pointer-events: none; }
    .page.cover { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .page .kicker { color: #b8862b; letter-spacing: 3px; font-weight: 700; font-size: 12pt; font-family: 'Fredoka', sans-serif; }
    .page .names { font-size: 36pt; font-weight: 700; margin: 12px 0; }
    .page .dates { font-style: italic; font-size: 15pt; }
    .page h3 { text-align: center; margin: 0; font-size: 18pt; }
    .page .evt { text-align: center; color: #b8862b; font-family: 'Fredoka', sans-serif; font-weight: 700; letter-spacing: 2px; font-size: 10pt; }
    .page .notes { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .page .n { background: #fff; border: 1px solid #e8d7b8; border-radius: 12px; padding: 12px 16px; font-size: 13pt; line-height: 1.45; }
    .page .n .k { font-family: 'Fredoka', sans-serif; font-size: 8pt; color: #b8862b; font-weight: 700; letter-spacing: 1px; }
    .page .n .by { text-align: right; font-weight: 700; font-size: 10pt; margin-top: 4px; }
    .page .wm { position: absolute; bottom: 0.3in; left: 0; right: 0; text-align: center; font-size: 8pt; color: #999; }
    .page table { width: 100%; border-collapse: collapse; font-size: 13pt; margin-top: 12px; }
    .page td { padding: 5px 4px; border-bottom: 1px solid #e8d7b8; }
    .page td.r { text-align: right; }
    [dir="rtl"] { text-align: right; }
    @media print { body.wed { background: none !important; } .no-print, .bg, #toasts { display: none !important; } .pages { padding: 0; gap: 0; } .page { box-shadow: none; page-break-after: always; break-after: page; } }
  </style>
</head>
<body class="wed">
  <main class="wed-wrap no-print book-controls">
    <div class="card">
      <h2>📖 Keepsake book</h2>
      <div class="row"><label class="small">Size</label><select class="input" id="paper"><option value="letter">US Letter</option><option value="a4">A4</option><option value="photo8">8×8 in photo book</option></select></div>
      <div class="row" style="margin-top:8px"><button class="btn btn-gold btn-sm" id="dl">⬇️ Download PDF</button><button class="btn btn-ghost btn-sm" id="print">🖨 Print / Save as PDF (all languages)</button></div>
      <p class="small muted" id="note"></p>
    </div>
  </main>
  <div class="pages" id="pages"></div>
  <div id="toasts"></div>
  <script type="module" src="/js/wedding/book.js"></script>
</body>
</html>
